name: CI Build

# Exercise 2: Kapan workflow ini berjalan?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Exercise 3: Apa yang dilakukan?
jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim

    # Di bawah ini adalah langkah awal (nanti akan ditambah di exercise selanjutnya)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt